<rect x="620" y="660" width="500" height="64" rx="8" fill="#FDF0E3" stroke="#B45309" stroke-width="1"/>
<text x="632" y="682" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">性能约束：renderHand / renderButtons 每收到一条快照就重建节点 × 39 张手牌，清容器必</text>
<text x="632" y="698" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">须用 destroyChildren()（先摘后毁），否则显存泄漏 → 上下文丢失 → 白屏（PR #8 根因）</text>
<text x="632" y="714" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">。</text>
