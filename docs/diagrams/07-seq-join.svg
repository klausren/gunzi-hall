<line x1="850.0" y1="710" x2="190.0" y2="710" stroke="#1D4ED8" stroke-width="1.4" marker-end="url(#a)"/>
<text x="520.0" y="703" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">emit()：event + snapshotFor(playerId)（每家一份私有手牌）</text>
<path d="M850.0 756 L878.0 756 L878.0 776 L850.0 776" fill="none" stroke="#4B5563" stroke-width="1.3" marker-end="url(#a)"/>
<text x="886.0" y="772" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">scheduleDrive()：bot 每步随机思考 0.8–2.5s</text>
<rect x="60" y="800" width="1060" height="48" rx="8" fill="#EEF2F6" stroke="#64748B" stroke-width="1"/>
<text x="72" y="822" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">重连分支（同一顺序图的另一入口）：hasPlayer(playerId) 命中 → addSink(sink) → 先发确定性快照 → resumeAfterRestore() 恢复 bot 驱动。</text>
<text x="72" y="838" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">顺序不可颠倒：若先恢复驱动，异步线程可能已推进牌局，重连者会拿到过期快照。</text>
