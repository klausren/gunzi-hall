<line x1="850.0" y1="630" x2="1070.0" y2="630" stroke="#6D28D9" stroke-width="1.4" marker-end="url(#a)"/>
<text x="960.0" y="623" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6D28D9" text-anchor="middle">ShuffleAndDealCommand(seed)：洗牌 + 发 39×4 + 底 6</text>
<line x1="1070.0" y1="670" x2="850.0" y2="670" stroke="#047857" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
